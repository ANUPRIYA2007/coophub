# ============================================================
# COOP HUB Production / Staging Multi-Instance Architecture
# Nginx Reverse Proxy Load Balancer + 3 Horizontal API Nodes
# ============================================================

services:
  # Public Entry Point: Nginx Load Balancer
  nginx:
    image: nginx:1.27-alpine
    container_name: coophub-load-balancer
    ports:
      - "80:80"
      - "5000:5000"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - api-1
      - api-2
      - api-3
    networks:
      - coophub-network
    restart: unless-stopped

  # Backend Instance #1
  api-1:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: coophub-api-1
    environment:
      - INSTANCE_ID=api-1
      - PORT=5000
      - NODE_ENV=production
    env_file:
      - path: .env
        required: false
    networks:
      - coophub-network
    restart: unless-stopped

  # Backend Instance #2
  api-2:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: coophub-api-2
    environment:
      - INSTANCE_ID=api-2
      - PORT=5000
      - NODE_ENV=production
    env_file:
      - path: .env
        required: false
    networks:
      - coophub-network
    restart: unless-stopped

  # Backend Instance #3
  api-3:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: coophub-api-3
    environment:
      - INSTANCE_ID=api-3
      - PORT=5000
      - NODE_ENV=production
    env_file:
      - path: .env
        required: false
    networks:
      - coophub-network
    restart: unless-stopped

networks:
  coophub-network:
    driver: bridge
