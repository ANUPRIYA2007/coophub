# ============================================================
# COOP HUB Production / Staging Multi-Instance Architecture
# Nginx Reverse Proxy Load Balancer + 3 Horizontal API Nodes
# ============================================================

services:
  # Public Entry Point: Nginx Load Balancer
  nginx:
    image: nginx:1.27-alpine
    container_name: coophub-load-balancer
    ports:
      - "80:80"
      - "5000:5000"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - api-1
      - api-2
      - api-3
    networks:
      - coophub-network
    restart: unless-stopped

  # Backend Instance #1
  api-1:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: coophub-api-1
    environment:
      - INSTANCE_ID=api-1
      - PORT=5000
      - NODE_ENV=production
      - EASY_OCR_SERVICE_URL=http://easyocr:8002/ocr/easy
    env_file:
      - path: .env
        required: false
    depends_on:
      - easyocr
    networks:
      - coophub-network
    restart: unless-stopped

  # Backend Instance #2
  api-2:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: coophub-api-2
    environment:
      - INSTANCE_ID=api-2
      - PORT=5000
      - NODE_ENV=production
      - EASY_OCR_SERVICE_URL=http://easyocr:8002/ocr/easy
    env_file:
      - path: .env
        required: false
    depends_on:
      - easyocr
    networks:
      - coophub-network
    restart: unless-stopped

  # Backend Instance #3
  api-3:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: coophub-api-3
    environment:
      - INSTANCE_ID=api-3
      - PORT=5000
      - NODE_ENV=production
      - EASY_OCR_SERVICE_URL=http://easyocr:8002/ocr/easy
    env_file:
      - path: .env
        required: false
    depends_on:
      - easyocr
    networks:
      - coophub-network
    restart: unless-stopped

  # Secondary KYC OCR Service: EasyOCR Microservice
  easyocr:
    build:
      context: .
      dockerfile: services/ocr/Dockerfile.easyocr
    container_name: coophub-easyocr
    ports:
      - "8002:8002"
    environment:
      - PORT=8002
      - PYTHONUNBUFFERED=1
    volumes:
      - easyocr-models:/root/.EasyOCR/model
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8002/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    networks:
      - coophub-network
    restart: unless-stopped

volumes:
  easyocr-models:

networks:
  coophub-network:
    driver: bridge

