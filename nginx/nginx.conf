# ============================================================
# COOP HUB Production Nginx Load Balancer Configuration
# Upstream Round-Robin Routing with Automatic Node Failover
# ============================================================

user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for" '
                    'upstream: $upstream_addr rt=$request_time uct="$upstream_connect_time"';

    access_log /var/log/nginx/access.log main;

    sendfile on;
    keepalive_timeout 65;
    client_max_body_size 35M;

    # Map for WebSocket Upgrade Header Negotiation
    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }

    # Upstream Backend Pool (Round-Robin with passive health check failover)
    upstream coop_hub_api {
        server api-1:5000 max_fails=3 fail_timeout=10s;
        server api-2:5000 max_fails=3 fail_timeout=10s;
        server api-3:5000 max_fails=3 fail_timeout=10s;
        keepalive 32;
    }

    server {
        listen 80;
        listen 5000;
        server_name localhost _;

        # Security Headers
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;

        # Load Balancer Diagnostic / Status Endpoint
        location /lb-status {
            access_log off;
            default_type application/json;
            return 200 '{"status":"healthy","load_balancer":"nginx","algorithm":"round-robin","upstream":"coop_hub_api"}';
        }

        # Reverse Proxy for all API routes & backend operations
        location / {
            proxy_pass http://coop_hub_api;

            # Forwarding headers
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Port $server_port;

            # WebSocket & Realtime Upgrade Support
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;

            # Timeouts
            proxy_connect_timeout 5s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;

            # Failover: If an instance errors, times out, or returns 502/503/504,
            # seamlessly pass request to the next healthy backend instance
            proxy_next_upstream error timeout invalid_header http_500 http_502 http_503 http_504;
            proxy_next_upstream_tries 3;
            proxy_next_upstream_timeout 10s;
        }
    }
}
