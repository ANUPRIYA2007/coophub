services:
  - type: web
    name: coophub-frontend
    runtime: static
    repo: https://github.com/ANUPRIYA2007/coophub
    branch: main
    buildCommand: npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /api/*
        destination: https://coophub-backend-production-60ba.up.railway.app/api/*
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_SERVER_URL
        value: https://coophub-backend-production-60ba.up.railway.app
      - key: VITE_SUPABASE_URL
        sync: false
      - key: VITE_SUPABASE_ANON_KEY
        sync: false
      - key: VITE_GOOGLE_MAPS_API_KEY
        sync: false
      - key: VITE_NVIDIA_API_KEY
        sync: false
      - key: VITE_NVIDIA_MODEL
        sync: false
      - key: VITE_NVIDIA_OCR_MODEL
        sync: false
      - key: VITE_GEMINI_API_KEY
        sync: false
      - key: VITE_RAZORPAY_KEY_ID
        sync: false
