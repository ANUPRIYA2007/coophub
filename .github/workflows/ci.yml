name: COOP HUB Continuous Integration (CI)

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Job 1: Verification, Linting, Testing, and Frontend Build
  build-and-test:
    name: Lint, Test & Production Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20 LTS
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run Linter
        run: npm run lint

      - name: Validate Backend JavaScript Syntax
        run: npm run syntax:check

      - name: Run Security Audit & Secrets Scan
        run: npm run security:check

      - name: Run Automated Test Suites
        run: npm test

      - name: Build Production Frontend (Vite)
        run: npm run build

  # Job 2: Backend Containerization & Load Balancer Compose Validation
  docker-validation:
    name: Docker & Compose Validation
    runs-on: ubuntu-latest
    needs: build-and-test

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Backend Docker Image
        run: docker build -t coop-hub-api:ci-test .

      - name: Validate Docker Compose Configuration
        run: docker compose config --quiet

      - name: Test Container Startup & Health Check Endpoint
        run: |
          # Start isolated container instance on port 5000
          docker run -d --name test-api -p 5000:5000 -e INSTANCE_ID=api-ci-check coop-hub-api:ci-test
          
          # Poll health check endpoint (fail CI if not responsive within 25 seconds)
          echo "Verifying /api/health endpoint responsiveness..."
          READY=0
          for i in $(seq 1 25); do
            if curl -f -s http://localhost:5000/api/health; then
              echo -e "\n✓ Container health check verified successfully on attempt $i"
              READY=1
              break
            fi
            echo "Waiting for container to be ready (attempt $i/25)..."
            sleep 1
          done
          
          # Stop and cleanup container
          docker logs test-api
          docker stop test-api
          docker rm test-api
          
          if [ $READY -ne 1 ]; then
            echo "✗ Container failed health check within 25 seconds"
            exit 1
          fi
