name: COOP HUB Continuous Deployment (CD)

on:
  push:
    branches: [ main ]
    tags: [ 'v*.*.*' ]
  workflow_dispatch:
    inputs:
      target_env:
        description: 'Deployment Target Environment'
        required: true
        default: 'staging'
        type: choice
        options:
          - staging
          - production
      trigger_rollback:
        description: 'Trigger Rollback to Previous Stable Tag'
        required: false
        default: false
        type: boolean

concurrency:
  group: cd-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  # ============================================================================
  # Stage 1: Build & Publish Container Images to GitHub Container Registry
  # ============================================================================
  publish-container:
    name: Build & Publish Docker Image to GHCR
    runs-on: ubuntu-latest
    if: ${{ !inputs.trigger_rollback }}

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker Metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/backend
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short
            type=semver,pattern={{version}}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ============================================================================
  # Stage 2: Staging Deployment & Automated Smoke Tests
  # ============================================================================
  deploy-staging:
    name: Deploy to Staging Environment
    runs-on: ubuntu-latest
    needs: publish-container
    environment: staging
    if: github.ref == 'refs/heads/main' || github.event.inputs.target_env == 'staging'

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Check for Staging Deployment Configuration
        id: check-secrets
        run: |
          if [ -z "${{ secrets.DEPLOY_HOST }}" ]; then
            echo "::notice title=Staging Deployment Pending::DEPLOY_HOST secret is not configured. Live SSH deployment skipped."
            echo "configured=false" >> $GITHUB_OUTPUT
          else
            echo "configured=true" >> $GITHUB_OUTPUT
          fi

      - name: Deploy to Staging Server via SSH
        if: steps.check-secrets.outputs.configured == 'true'
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          script: |
            cd /opt/coophub
            docker compose pull
            docker compose up -d --remove-orphans
            docker system prune -f

      - name: Setup Node for Staging Smoke Tests
        if: steps.check-secrets.outputs.configured == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run Staging End-to-End Smoke Tests
        id: smoke-test
        if: steps.check-secrets.outputs.configured == 'true'
        run: |
          STAGING_URL="${{ secrets.STAGING_URL || 'https://staging-api.coophub.org' }}"
          echo "Executing automated staging smoke tests against ${STAGING_URL}..."
          node scripts/smoke_test_staging.mjs --target="${STAGING_URL}"

      - name: Automated Staging Rollback on Smoke Test Failure
        if: failure() && steps.smoke-test.outcome == 'failure' && steps.check-secrets.outputs.configured == 'true'
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          script: |
            echo "::error title=Deployment Failure::Staging smoke test failed. Rolling back..."
            cd /opt/coophub
            bash scripts/rollback.sh latest

  # ============================================================================
  # Stage 3: Production Deployment (Protected Gate - Requires Approval)
  # ============================================================================
  deploy-production:
    name: Deploy to Production Environment (Protected)
    runs-on: ubuntu-latest
    needs: deploy-staging
    environment: production
    if: github.ref == 'refs/heads/main' && startsWith(github.ref, 'refs/tags/v') || github.event.inputs.target_env == 'production'

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Check for Production Deployment Configuration
        id: check-prod-secrets
        run: |
          if [ -z "${{ secrets.PROD_DEPLOY_HOST || secrets.DEPLOY_HOST }}" ]; then
            echo "::notice title=Production Deployment Pending::Production deployment credentials not configured."
            echo "configured=false" >> $GITHUB_OUTPUT
          else
            echo "configured=true" >> $GITHUB_OUTPUT
          fi

      - name: Deploy to Production Cluster via SSH
        if: steps.check-prod-secrets.outputs.configured == 'true'
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.PROD_DEPLOY_HOST || secrets.DEPLOY_HOST }}
          username: ${{ secrets.PROD_DEPLOY_USER || secrets.DEPLOY_USER }}
          key: ${{ secrets.PROD_DEPLOY_SSH_KEY || secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.PROD_DEPLOY_PORT || secrets.DEPLOY_PORT || 22 }}
          script: |
            cd /opt/coophub
            docker compose pull
            docker compose up -d --remove-orphans

      - name: Setup Node for Production Smoke Tests
        if: steps.check-prod-secrets.outputs.configured == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run Production Verification Smoke Tests
        if: steps.check-prod-secrets.outputs.configured == 'true'
        run: |
          PROD_URL="${{ secrets.PRODUCTION_URL || 'https://api.coophub.org' }}"
          node scripts/smoke_test_staging.mjs --target="${PROD_URL}"

  # ============================================================================
  # Stage 4: Manual Rollback Workflow
  # ============================================================================
  manual-rollback:
    name: Execute Manual Rollback
    runs-on: ubuntu-latest
    if: ${{ inputs.trigger_rollback }}

    steps:
      - name: Execute Manual Rollback via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          script: |
            cd /opt/coophub
            bash scripts/rollback.sh previous
